<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Pembaca PDF</title>
<style>
  :root {
    --bg: #e6ebf0;
    --bar: #ffffff;
    --ink: #1c2733;
    --muted: #5f6f7f;
    --line: #d3dbe3;
    --accent: #0f766e;
    --accent-ink: #ffffff;
    --shadow: 0 1px 3px rgba(20, 40, 60, .18), 0 6px 18px rgba(20, 40, 60, .12);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #11161c; --bar: #1a212a; --ink: #e4eaf0; --muted: #93a3b3;
      --line: #2a3441; --accent: #5ec4b6; --accent-ink: #0b1a18;
      --shadow: 0 1px 3px rgba(0,0,0,.5), 0 6px 18px rgba(0,0,0,.4);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #11161c; --bar: #1a212a; --ink: #e4eaf0; --muted: #93a3b3;
    --line: #2a3441; --accent: #5ec4b6; --accent-ink: #0b1a18;
    --shadow: 0 1px 3px rgba(0,0,0,.5), 0 6px 18px rgba(0,0,0,.4);
    color-scheme: dark;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column;
    background: var(--bg); color: var(--ink);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }

  /* Toolbar */
  .bar {
    display: flex; align-items: center; gap: 6px;
    padding: 8px 10px; padding-top: max(8px, env(safe-area-inset-top));
    background: var(--bar); border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
  }
  .title {
    flex: 1 1 120px; min-width: 0; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .title small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
  button, .btn {
    appearance: none; border: 1px solid var(--line); background: transparent;
    color: var(--ink); font: inherit; border-radius: 8px;
    min-width: 40px; height: 40px; padding: 0 12px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  }
  button:hover, .btn:hover { background: color-mix(in srgb, var(--ink) 7%, transparent); }
  button:disabled { opacity: .35; cursor: default; }
  button:focus-visible, .btn:focus-visible, input:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  .primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  .primary:hover { background: var(--accent); filter: brightness(1.08); }
  .group { display: flex; align-items: center; gap: 4px; }
  .pageinput {
    width: 52px; height: 40px; text-align: center; font: inherit;
    border: 1px solid var(--line); border-radius: 8px;
    background: transparent; color: var(--ink);
  }
  .total { color: var(--muted); white-space: nowrap; }
  .zoomlabel { min-width: 48px; text-align: center; color: var(--muted); font-variant-numeric: tabular-nums; }
  svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* Viewer */
  #viewer { flex: 1; overflow: auto; position: relative; -webkit-overflow-scrolling: touch; }
  #pages { padding: 14px 12px 40px; display: flex; flex-direction: column; align-items: center; gap: 12px; min-width: min-content; }
  .page { background: #fff; box-shadow: var(--shadow); position: relative; flex: none; }
  .page canvas { display: block; width: 100%; height: 100%; }
  body.invert .page canvas { filter: invert(.92) hue-rotate(180deg); }
  body.invert .page { background: #111; }

  /* Empty state */
  #empty {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    padding: 24px; text-align: center;
  }
  #empty h1 { margin: 0; font-size: 22px; font-weight: 650; }
  #empty p { margin: 0; color: var(--muted); max-width: 32ch; }
  #empty .btn { height: 46px; padding: 0 22px; font-size: 16px; }
  #viewer.drag { outline: 3px dashed var(--accent); outline-offset: -10px; }

  #msg {
    position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom));
    transform: translateX(-50%); background: var(--ink); color: var(--bg);
    padding: 10px 16px; border-radius: 10px; max-width: 90vw; display: none; z-index: 5;
  }
  .hidden { display: none !important; }
  @media (max-width: 520px) { .hide-sm { display: none !important; } }
</style>
</head>
<body>

<header class="bar">
  <label class="btn primary" for="file" title="Buka file PDF">
    <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
    <span>Buka</span>
  </label>
  <input id="file" type="file" accept="application/pdf,.pdf" class="hidden">

  <div class="title" id="title">Pembaca PDF<small id="sub">Belum ada file</small></div>

  <div class="group" id="nav">
    <button id="prev" title="Halaman sebelumnya" aria-label="Halaman sebelumnya" disabled><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <input id="pageNum" class="pageinput" type="number" min="1" value="1" inputmode="numeric" aria-label="Nomor halaman" disabled>
    <span class="total" id="total">/ –</span>
    <button id="next" title="Halaman berikutnya" aria-label="Halaman berikutnya" disabled><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
  </div>

  <div class="group">
    <button id="zoomOut" title="Perkecil" aria-label="Perkecil" disabled><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
    <span class="zoomlabel hide-sm" id="zoomLabel">100%</span>
    <button id="zoomIn" title="Perbesar" aria-label="Perbesar" disabled><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <button id="fit" class="hide-sm" title="Sesuaikan lebar" aria-label="Sesuaikan lebar" disabled><svg viewBox="0 0 24 24"><path d="M4 12h16M8 8l-4 4 4 4M16 8l4 4-4 4"/></svg></button>
    <button id="invert" title="Mode baca malam (balik warna halaman)" aria-label="Mode baca malam" disabled><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v18" /><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg></button>
    <button id="theme" title="Ganti tema aplikasi" aria-label="Ganti tema"><svg viewBox="0 0 24 24"><path d="M21 13a9 9 0 1 1-10-10 7 7 0 0 0 10 10z"/></svg></button>
  </div>
</header>

<main id="viewer">
  <div id="empty">
    <h1>Baca PDF, tanpa ribet</h1>
    <p>Berjalan di perangkat Anda. File tidak diunggah ke mana pun.</p>
    <label class="btn primary" for="file">Pilih file PDF</label>
    <p class="hide-sm">atau seret file ke sini</p>
  </div>
  <div id="pages"></div>
</main>

<div id="msg" role="status"></div>

<script type="module">
/* ---------- pdf.js dibundel lokal di dalam aplikasi (100% offline) ---------- */
import * as pdfjsLib from './lib/pdf.min.mjs';
pdfjsLib.GlobalWorkerOptions.workerSrc = './lib/pdf.worker.min.mjs';
const loadLib = () => Promise.resolve();

/* ---------- Elemen & state ---------- */
const $ = id => document.getElementById(id);
const viewer = $('viewer'), pagesEl = $('pages'), empty = $('empty');
const ctrl = ['prev','pageNum','next','zoomOut','zoomIn','fit','invert'].map($);

let pdf = null, total = 0, zoom = 1, fitScale = 1, baseW = 612, baseH = 792;
let current = 1, observer = null, rendering = new Map(), token = 0;

function toast(text, ms = 3500) {
  const m = $('msg'); m.textContent = text; m.style.display = 'block';
  clearTimeout(toast.t); toast.t = setTimeout(() => m.style.display = 'none', ms);
}
function setEnabled(on) { ctrl.forEach(el => el.disabled = !on); }

/* ---------- Membuka file ---------- */
async function openFile(file) {
  if (!file) return;
  if (file.type !== 'application/pdf' && !/\.pdf$/i.test(file.name)) {
    toast('File ini bukan PDF.'); return;
  }
  try {
    await loadLib();
    const data = new Uint8Array(await file.arrayBuffer());
    const task = pdfjsLib.getDocument({ data });
    task.onPassword = (update, reason) => {
      const msg = reason === 2 ? 'Kata sandi salah. Coba lagi:' : 'PDF ini dikunci. Masukkan kata sandi:';
      const pw = prompt(msg);
      if (pw === null) task.destroy(); else update(pw);
    };
    const doc = await task.promise;
    if (pdf) pdf.destroy();
    pdf = doc; total = doc.numPages; current = 1; zoom = 1;
    $('title').firstChild.nodeValue = file.name;
    $('sub').textContent = total + ' halaman';
    $('total').textContent = '/ ' + total;
    $('pageNum').max = total;
    empty.classList.add('hidden');
    setEnabled(true);
    await layout(1);
  } catch (e) {
    if (e && e.name === 'PasswordException') return;
    toast(e && e.message ? 'Gagal membuka: ' + e.message : 'Gagal membuka PDF.', 5000);
  }
}

/* ---------- Tata letak halaman ---------- */
async function layout(goTo) {
  const my = ++token;
  rendering.forEach(t => { try { t.cancel(); } catch (_) {} });
  rendering.clear();
  if (observer) observer.disconnect();

  const first = await pdf.getPage(1);
  if (my !== token) return;
  const v = first.getViewport({ scale: 1 });
  baseW = v.width; baseH = v.height;

  const avail = Math.max(240, viewer.clientWidth - 24);
  fitScale = avail / baseW;
  const scale = fitScale * zoom;
  $('zoomLabel').textContent = Math.round(zoom * 100) + '%';

  pagesEl.textContent = '';
  const frag = document.createDocumentFragment();
  for (let i = 1; i <= total; i++) {
    const d = document.createElement('div');
    d.className = 'page'; d.dataset.n = i;
    d.style.width = Math.floor(baseW * scale) + 'px';
    d.style.height = Math.floor(baseH * scale) + 'px';
    frag.appendChild(d);
  }
  pagesEl.appendChild(frag);

  observer = new IntersectionObserver(entries => {
    for (const en of entries) {
      const n = +en.target.dataset.n;
      if (en.isIntersecting) renderPage(n, en.target, my);
      else release(n, en.target);
    }
  }, { root: viewer, rootMargin: '700px 0px' });
  pagesEl.querySelectorAll('.page').forEach(p => observer.observe(p));

  goToPage(goTo || current, false);
}

async function renderPage(n, box, my) {
  if (box.dataset.done || rendering.has(n)) return;
  try {
    const page = await pdf.getPage(n);
    if (my !== token) return;
    const scale = fitScale * zoom;
    const vp = page.getViewport({ scale });
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const canvas = document.createElement('canvas');
    canvas.width = Math.floor(vp.width * dpr);
    canvas.height = Math.floor(vp.height * dpr);
    box.style.width = Math.floor(vp.width) + 'px';
    box.style.height = Math.floor(vp.height) + 'px';
    const task = page.render({
      canvasContext: canvas.getContext('2d'),
      viewport: vp,
      transform: dpr !== 1 ? [dpr, 0, 0, dpr, 0, 0] : null
    });
    rendering.set(n, task);
    await task.promise;
    rendering.delete(n);
    if (my !== token) return;
    box.textContent = '';
    box.appendChild(canvas);
    box.dataset.done = '1';
    page.cleanup();
  } catch (e) {
    rendering.delete(n);
    if (!e || e.name !== 'RenderingCancelledException') console.warn(e);
  }
}

function release(n, box) {
  const t = rendering.get(n);
  if (t) { try { t.cancel(); } catch (_) {} rendering.delete(n); }
  if (box.dataset.done) { box.textContent = ''; delete box.dataset.done; } // hemat memori
}

/* ---------- Navigasi ---------- */
function goToPage(n, smooth = true) {
  n = Math.min(Math.max(1, n | 0), total);
  const el = pagesEl.children[n - 1];
  if (!el) return;
  viewer.scrollTo({ top: el.offsetTop - 8, behavior: smooth ? 'smooth' : 'auto' });
  setCurrent(n);
}
function setCurrent(n) {
  current = n;
  const input = $('pageNum');
  if (document.activeElement !== input) input.value = n;
  $('prev').disabled = n <= 1;
  $('next').disabled = n >= total;
}
let ticking = false;
viewer.addEventListener('scroll', () => {
  if (!pdf || ticking) return;
  ticking = true;
  requestAnimationFrame(() => {
    ticking = false;
    const mid = viewer.scrollTop + viewer.clientHeight * 0.35;
    const kids = pagesEl.children;
    let lo = 0, hi = kids.length - 1;
    while (lo < hi) {            // pencarian biner: cepat untuk ribuan halaman
      const m = (lo + hi + 1) >> 1;
      if (kids[m].offsetTop <= mid) lo = m; else hi = m - 1;
    }
    setCurrent(lo + 1);
  });
}, { passive: true });

$('prev').onclick = () => goToPage(current - 1);
$('next').onclick = () => goToPage(current + 1);
$('pageNum').addEventListener('keydown', e => { if (e.key === 'Enter') { goToPage(+e.target.value); e.target.blur(); } });
$('pageNum').addEventListener('change', e => goToPage(+e.target.value));

/* ---------- Zoom ---------- */
let zt;
function setZoom(z) {
  zoom = Math.min(4, Math.max(0.4, Math.round(z * 100) / 100));
  $('zoomLabel').textContent = Math.round(zoom * 100) + '%';
  clearTimeout(zt);
  zt = setTimeout(() => pdf && layout(current), 180);
}
$('zoomIn').onclick = () => setZoom(zoom + 0.15);
$('zoomOut').onclick = () => setZoom(zoom - 0.15);
$('fit').onclick = () => setZoom(1);

let rt;
window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => pdf && layout(current), 250); });

/* ---------- Tema ---------- */
$('invert').onclick = () => document.body.classList.toggle('invert');
$('theme').onclick = () => {
  const root = document.documentElement;
  const dark = root.dataset.theme
    ? root.dataset.theme === 'dark'
    : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
};

/* ---------- Input file, seret & lepas, keyboard ---------- */
$('file').addEventListener('change', e => { openFile(e.target.files[0]); e.target.value = ''; });
['dragenter', 'dragover'].forEach(t => viewer.addEventListener(t, e => { e.preventDefault(); viewer.classList.add('drag'); }));
['dragleave', 'drop'].forEach(t => viewer.addEventListener(t, e => { e.preventDefault(); viewer.classList.remove('drag'); }));
viewer.addEventListener('drop', e => openFile(e.dataTransfer.files[0]));

document.addEventListener('keydown', e => {
  if (!pdf || e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown' && e.shiftKey) goToPage(current + 1);
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp' && e.shiftKey) goToPage(current - 1);
  else if (e.key === 'Home') { e.preventDefault(); goToPage(1); }
  else if (e.key === 'End') { e.preventDefault(); goToPage(total); }
  else if ((e.key === '+' || e.key === '=') ) setZoom(zoom + 0.15);
  else if (e.key === '-') setZoom(zoom - 0.15);
  else if (e.key === '0') setZoom(1);
});
</script>
</body>
</html>
